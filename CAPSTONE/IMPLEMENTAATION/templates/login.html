{% extends "base.html" %}

{% block title %}
Student Login | UniCourse
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            🎓
        </div>

        <h1>
            Student Login
        </h1>

        <p class="auth-subtitle">
            Access your UniCourse student portal
        </p>

        <form method="POST">

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Sign In →

            </button>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>


        <div class="auth-footer">

            <a href="/instructor_login">
                Instructor Login
            </a>

            &nbsp; • &nbsp;

            <a href="/admin_login">
                Admin Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
