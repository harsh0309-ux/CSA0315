{% extends "base.html" %}

{% block title %}
Instructor Login | UniCourse
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            👨‍🏫
        </div>

        <h1>
            Instructor Login
        </h1>

        <p class="auth-subtitle">
            Access your teaching and course portal
        </p>

        <form method="POST">

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Instructor email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Instructor Sign In →

            </button>

        </form>


        <div class="auth-footer">

            <a href="/login">
                Student Login
            </a>

            &nbsp; • &nbsp;

            <a href="/admin_login">
                Admin Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
