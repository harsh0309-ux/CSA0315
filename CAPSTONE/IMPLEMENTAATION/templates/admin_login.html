{% extends "base.html" %}

{% block title %}
Admin Login | UniCourse
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            ⚙️
        </div>

        <h1>
            Administrator
        </h1>

        <p class="auth-subtitle">
            Secure administrative access
        </p>


        <form method="POST">

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Admin username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Admin Sign In →

            </button>

        </form>


        <div class="auth-footer">

            <a href="/">
                ← Back to UniCourse
            </a>

        </div>

    </div>

</div>

{% endblock %}
