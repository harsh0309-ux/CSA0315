{% extends "base.html" %}

{% block title %}
Create Student Account | UniCourse
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            ✨
        </div>

        <h1>
            Create Account
        </h1>

        <p class="auth-subtitle">
            Register as a UniCourse student
        </p>


        <form method="POST">

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="full_name"
                    placeholder="Enter full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Registration Number
                </label>

                <input
                    type="text"
                    name="registration_no"
                    placeholder="Enter registration number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Create Student Account →

            </button>

        </form>


        <div class="auth-footer">

            Already registered?

            <a href="/login">
                Sign In
            </a>

        </div>

    </div>

</div>

{% endblock %}
